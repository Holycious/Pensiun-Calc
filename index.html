<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Kalkulator Dana Pensiun instan berbasis Aturan 4% (Trinity Study), inflasi, dan bunga majemuk. Tanpa login dan tanpa simpan data.">
<title>Kalkulator Dana Pensiun</title>
<style>
:root{
  --bg:#f8fafc;--card:#ffffff;--tx:#0f172a;--mu:#64748b;--bd:#e2e8f0;
  --ac:#0d9488;--ac-light:#f0fdfa;--ac-dark:#115e59;
  --wa:#eab308;--err:#ef4444;--suc:#22c55e;
  --radius:12px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#090d16;--card:#111827;--tx:#f1f5f9;--mu:#94a3b8;--bd:#1f2937;
    --ac:#14b8a6;--ac-light:#132a2a;--ac-dark:#2dd4bf;
  }
}
:root[data-theme="dark"]{
  --bg:#090d16;--card:#111827;--tx:#f1f5f9;--mu:#94a3b8;--bd:#1f2937;
  --ac:#14b8a6;--ac-light:#132a2a;--ac-dark:#2dd4bf;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg);color:var(--tx);
  font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding:24px 16px 60px;
}
main{max-width:760px;margin:0 auto}
header{margin-bottom:20px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
h1{font-size:1.6rem;font-weight:800;letter-spacing:-0.02em;color:var(--tx)}
.sub{color:var(--mu);font-size:.9rem;margin-top:2px}
.theme-btn{
  background:transparent;border:1px solid var(--bd);color:var(--mu);
  padding:6px 10px;border-radius:8px;font-size:.8rem;cursor:pointer;
}
.card{
  background:var(--card);border:1px solid var(--bd);border-radius:var(--radius);
  padding:20px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.03);
}
.presets{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.presets span{font-size:.8rem;color:var(--mu);align-self:center}
.btn-preset{
  background:var(--card);border:1px solid var(--bd);color:var(--tx);
  padding:4px 10px;border-radius:6px;font-size:.78rem;cursor:pointer;
  transition:all .15s ease;
}
.btn-preset:hover{border-color:var(--ac);color:var(--ac)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:560px){.grid{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column}
label{font-size:.82rem;font-weight:600;color:var(--mu);margin-bottom:6px}
.input-wrap{position:relative;display:flex;align-items:center}
.prefix,.suffix{position:absolute;font-size:.88rem;color:var(--mu);pointer-events:none}
.prefix{left:12px}
.suffix{right:12px}
input{
  width:100%;padding:10px 12px;font-size:.98rem;font-weight:600;
  border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);
  transition:border-color .15s,outline .15s;
}
input.has-prefix{padding-left:36px}
input.has-suffix{padding-right:32px}
input:focus{outline:2px solid var(--ac);border-color:transparent}
.terbilang{font-size:.75rem;color:var(--ac);margin-top:4px;min-height:16px;font-weight:500}
.hero{
  background:var(--ac-light);border:1px solid var(--ac);text-align:center;padding:24px 16px;
}
.hero .caption{font-size:.85rem;color:var(--mu);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.hero .big{font-size:2.2rem;font-weight:800;color:var(--ac-dark);line-height:1.2;margin:6px 0}
.hero .desc{font-size:.86rem;color:var(--mu)}
.status-badge{
  display:inline-block;padding:4px 12px;border-radius:999px;font-size:.82rem;
  font-weight:600;margin-top:10px;background:rgba(34,197,94,.15);color:var(--suc);
}
.breakdown-bar{margin:16px 0 10px}
.bar-track{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--bd)}
.bar-setor{background:var(--ac);transition:width .3s}
.bar-bunga{background:#38bdf8;transition:width .3s}
.bar-legend{display:flex;justify-content:space-between;font-size:.78rem;color:var(--mu);margin-top:6px}
.legend-item{display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd);gap:12px;font-size:.9rem}
.row:last-child{border:0}
.row span:first-child{color:var(--mu)}
.row b{font-weight:700;text-align:right}
.badge-save{color:var(--suc);background:rgba(34,197,94,.1);padding:2px 6px;border-radius:4px;font-size:.82rem}
.alert{background:#fef2f2;border:1px solid #fecaca;color:#991b1b;padding:14px;border-radius:var(--radius);margin-bottom:16px;font-size:.9rem}
.scroll{overflow-x:auto;max-height:280px;border-radius:8px;border:1px solid var(--bd)}
table{width:100%;border-collapse:collapse;font-size:.84rem;white-space:nowrap}
th,td{padding:8px 12px;text-align:right;border-bottom:1px solid var(--bd)}
th:first-child,td:first-child{text-align:left}
th{position:sticky;top:0;background:var(--card);color:var(--mu);font-weight:600;z-index:2}
tr:hover{background:rgba(0,0,0,.02)}
.share-wrap{display:flex;justify-content:flex-end;margin-bottom:16px}
.btn-share{
  background:transparent;border:1px dashed var(--bd);color:var(--mu);
  padding:6px 12px;border-radius:6px;font-size:.8rem;cursor:pointer;display:flex;align-items:center;gap:6px;
}
.btn-share:hover{border-color:var(--ac);color:var(--ac)}
.note{font-size:.8rem;color:var(--mu);line-height:1.45}
footer{margin-top:24px;border-top:1px solid var(--bd);padding-top:14px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:.78rem;color:var(--mu)}
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Kalkulator Dana Pensiun</h1>
      <p class="sub">Hitung target finansial pensiun dengan Aturan 4% & Bunga Majemuk.</p>
    </div>
    <button id="themeToggle" class="theme-btn" aria-label="Toggle tema">🌓 Mode</button>
  </header>

  <div class="presets">
    <span>Preset:</span>
    <button type="button" class="btn-preset" data-p="25,55,5000000,10000000,8,4">Pemula (25 th)</button>
    <button type="button" class="btn-preset" data-p="30,55,10000000,50000000,7,4">Menengah (30 th)</button>
    <button type="button" class="btn-preset" data-p="35,50,15000000,150000000,8,4">FIRE Cepat (35 th)</button>
  </div>

  <div class="card grid">
    <div class="field">
      <label for="age">Umur Saat Ini</label>
      <div class="input-wrap">
        <input id="age" type="number" value="30" min="1" max="100">
        <span class="suffix">th</span>
      </div>
    </div>

    <div class="field">
      <label for="tage">Umur Rencana Pensiun</label>
      <div class="input-wrap">
        <input id="tage" type="number" value="55" min="2" max="100">
        <span class="suffix">th</span>
      </div>
    </div>

    <div class="field">
      <label for="need">Kebutuhan Pengeluaran Bulanan (Nilai Sekarang)</label>
      <div class="input-wrap">
        <span class="prefix">Rp</span>
        <input id="need" class="has-prefix" type="text" inputmode="numeric" value="10.000.000">
      </div>
      <div id="needDesc" class="terbilang"></div>
    </div>

    <div class="field">
      <label for="init">Dana Awal yang Sudah Siap</label>
      <div class="input-wrap">
        <span class="prefix">Rp</span>
        <input id="init" class="has-prefix" type="text" inputmode="numeric" value="50.000.000">
      </div>
      <div id="initDesc" class="terbilang"></div>
    </div>

    <div class="field">
      <label for="rate">Estimasi Return Portofolio per Tahun</label>
      <div class="input-wrap">
        <input id="rate" class="has-suffix" type="number" value="7" step="0.1" min="0" max="50">
        <span class="suffix">%</span>
      </div>
    </div>

    <div class="field">
      <label for="inf">Estimasi Inflasi per Tahun</label>
      <div class="input-wrap">
        <input id="inf" class="has-suffix" type="number" value="4" step="0.1" min="0" max="30">
        <span class="suffix">%</span>
      </div>
    </div>
  </div>

  <div class="share-wrap">
    <button id="shareBtn" class="btn-share" type="button">🔗 Salin Link Simulasi Ini</button>
  </div>

  <div id="out"></div>

  <footer>
    <span>Client-side only. Bebas tracking, tanpa database.</span>
    <span>Aturan 4% (25× pengeluaran tahunan).</span>
  </footer>
</main>

<script>
// ponytail: helper ringkas format mata uang & kata nominal
const $ = id => document.getElementById(id);
const fmt = n => Math.round(n).toLocaleString("id-ID");
const rp = n => "Rp " + fmt(n);

function ringkasNominal(num) {
  if (num >= 1e12) return (num / 1e12).toFixed(1).replace(/\.0$/, '') + " Triliun";
  if (num >= 1e9) return (num / 1e9).toFixed(1).replace(/\.0$/, '') + " Miliar";
  if (num >= 1e6) return (num / 1e6).toFixed(1).replace(/\.0$/, '') + " Juta";
  if (num >= 1e3) return (num / 1e3).toFixed(1).replace(/\.0$/, '') + " Ribu";
  return num > 0 ? fmt(num) : "";
}

function parseCurrency(str) {
  const digits = String(str).replace(/[^\d]/g, "");
  return digits ? parseInt(digits, 10) : 0;
}

function bindCurrencyInput(input, descEl) {
  const update = () => {
    const val = parseCurrency(input.value);
    input.value = val ? fmt(val) : "";
    if (descEl) descEl.textContent = val ? `≈ ${ringkasNominal(val)}` : "";
    calc();
  };
  input.addEventListener("input", update);
  // initial desc
  if (descEl) {
    const val = parseCurrency(input.value);
    descEl.textContent = val ? `≈ ${ringkasNominal(val)}` : "";
  }
}

bindCurrencyInput($("need"), $("needDesc"));
bindCurrencyInput($("init"), $("initDesc"));

function calc() {
  const age = parseInt($("age").value, 10) || 0;
  const tage = parseInt($("tage").value, 10) || 0;
  const need = parseCurrency($("need").value);
  const init = parseCurrency($("init").value);
  const r = (parseFloat($("rate").value) || 0) / 100;
  const f = (parseFloat($("inf").value) || 0) / 100;
  const out = $("out");

  // Validasi dasar
  if (age < 0 || tage <= 0) {
    out.innerHTML = '<div class="alert">Umur harus berupa angka positif.</div>';
    return;
  }
  if (tage <= age) {
    out.innerHTML = '<div class="alert">Umur target pensiun harus lebih besar dari umur saat ini.</div>';
    return;
  }
  if (need <= 0) {
    out.innerHTML = '<div class="alert">Masukkan estimasi kebutuhan bulanan.</div>';
    return;
  }

  const yrs = tage - age;
  const m = yrs * 12;
  const i = r / 12;

  // Formula finansial:
  // 1. Kebutuhan bulanan di masa depan tersesuaikan inflasi
  const futNeed = need * Math.pow(1 + f, yrs);
  // 2. Target dana pensiun berdasarkan Rule of 25 (Aturan 4%)
  const target = futNeed * 12 * 25;
  // 3. Nilai masa depan dari dana awal yang sudah dimiliki
  const initFV = i === 0 ? init : init * Math.pow(1 + i, m);
  // 4. Selisih target yang masih kurang
  const gap = Math.max(0, target - initFV);
  // 5. Setoran bulanan biasa (Ordinary Annuity PMT)
  const pmt = gap === 0 ? 0 : (i === 0 ? gap / m : (gap * i) / (Math.pow(1 + i, m) - 1));
  // 6. Jika hanya menabung biasa tanpa instrumen investasi
  const plainGap = Math.max(0, target - init);
  const plainPmt = plainGap / m;

  const totalSetoran = init + (pmt * m);
  const totalBunga = Math.max(0, target - totalSetoran);
  const persenSetor = Math.min(100, Math.round((totalSetoran / target) * 100)) || 0;
  const persenBunga = Math.max(0, 100 - persenSetor);

  // Tabel proyeksi per tahun
  let rows = "";
  let bal = init;
  for (let y = 1; y <= yrs; y++) {
    for (let k = 0; k < 12; k++) {
      bal = (bal * (1 + i)) + pmt;
    }
    const totalSetorY = init + (pmt * 12 * y);
    rows += `<tr>
      <td>${age + y} th</td>
      <td>${rp(totalSetorY)}</td>
      <td style="color:var(--ac);font-weight:600">${rp(bal)}</td>
    </tr>`;
  }

  // Update query params secara halus (tanpa reload) untuk link sharing
  const params = new URLSearchParams({
    age, tage, need, init, rate: $("rate").value, inf: $("inf").value
  });
  window.history.replaceState(null, "", `#${params.toString()}`);

  const isSudahCukup = gap === 0;

  out.innerHTML = `
    <div class="card hero">
      <div class="caption">${isSudahCukup ? "Status Finansial" : "Tabungan / Investasi Per Bulan"}</div>
      <div class="big">${isSudahCukup ? "Dana Awal Sudah Cukup!" : rp(pmt)}</div>
      <div class="desc">
        ${isSudahCukup 
          ? `Dengan return ${(r*100).toFixed(1)}%/thn, dana awal Anda akan berkembang melampaui target tanpa perlu setoran tambahan.`
          : `Disisihkan setiap akhir bulan selama ${yrs} tahun (${m} bulan).`}
      </div>
      ${isSudahCukup ? '<div class="status-badge">Target Terpenuhi Mandiri</div>' : ''}
    </div>

    <div class="card">
      <h2 style="font-size:1rem;margin-bottom:12px">Komposisi Dana Pensiun Target</h2>
      <div class="breakdown-bar">
        <div class="bar-track">
          <div class="bar-setor" style="width:${persenSetor}%" title="Porsi Setoran Sendiri: ${persenSetor}%"></div>
          <div class="bar-bunga" style="width:${persenBunga}%" title="Porsi Bunga/Return: ${persenBunga}%"></div>
        </div>
        <div class="bar-legend">
          <div class="legend-item"><span class="dot" style="background:var(--ac)"></span>Setoran Pokok (${persenSetor}%)</div>
          <div class="legend-item"><span class="dot" style="background:#38bdf8"></span>Efek Bunga Majemuk (${persenBunga}%)</div>
        </div>
      </div>

      <div class="row">
        <span>Pengeluaran bulanan saat pensiun (+ inflasi ${(f*100).toFixed(1)}%)</span>
        <b>${rp(futNeed)}</b>
      </div>
      <div class="row">
        <span>Target Total Dana Pensiun (Rule of 25)</span>
        <b style="color:var(--ac)">${rp(target)}</b>
      </div>
      <div class="row">
        <span>Pertumbuhan Dana Awal di Masa Depan</span>
        <b>${rp(initFV)}</b>
      </div>
      <div class="row">
        <span>Kekurangan yang perlu dikumpulkan</span>
        <b>${rp(gap)}</b>
      </div>
      <div class="row">
        <span>Total uang riil yang Anda setor</span>
        <b>${rp(totalSetoran)}</b>
      </div>
      ${!isSudahCukup ? `
      <div class="row">
        <span>Jika menabung biasa (tanpa investasi)</span>
        <b style="color:var(--err)">${rp(plainPmt)} /bln</b>
      </div>
      <div class="row">
        <span>Hemat berkat bunga majemuk</span>
        <b class="badge-save">Hemat ${rp(Math.max(0, plainPmt - pmt))} /bln</b>
      </div>` : ''}
    </div>

    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <h2 style="font-size:1rem">Tabel Proyeksi Saldo Per Tahun</h2>
        <span style="font-size:.78rem;color:var(--mu)">Target tercapai di umur ${tage}</span>
      </div>
      <div class="scroll">
        <table>
          <thead>
            <tr>
              <th>Umur</th>
              <th>Total Setoran Pokok</th>
              <th>Saldo Terakumulasi</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>

    <p class="note">Catatan: Model ini mengasumsikan return majemuk tetap dan penarikan aman 4% per tahun sesuai kaidah Trinity Study. Bukan saran penasihat keuangan berlisensi.</p>
  `;
}

// Load dari Hash URL jika ada
function loadFromHash() {
  if (window.location.hash.length > 1) {
    try {
      const p = new URLSearchParams(window.location.hash.slice(1));
      if (p.has("age")) $("age").value = p.get("age");
      if (p.has("tage")) $("tage").value = p.get("tage");
      if (p.has("need")) $("need").value = fmt(parseInt(p.get("need"), 10) || 10000000);
      if (p.has("init")) $("init").value = fmt(parseInt(p.get("init"), 10) || 50000000);
      if (p.has("rate")) $("rate").value = p.get("rate");
      if (p.has("inf")) $("inf").value = p.get("inf");
      $("needDesc").textContent = `≈ ${ringkasNominal(parseCurrency($("need").value))}`;
      $("initDesc").textContent = `≈ ${ringkasNominal(parseCurrency($("init").value))}`;
    } catch(e){}
  }
}

// Preset handler
document.querySelectorAll(".btn-preset").forEach(btn => {
  btn.addEventListener("click", () => {
    const [age, tage, need, init, rate, inf] = btn.dataset.p.split(",");
    $("age").value = age;
    $("tage").value = tage;
    $("need").value = fmt(need);
    $("init").value = fmt(init);
    $("rate").value = rate;
    $("inf").value = inf;
    $("needDesc").textContent = `≈ ${ringkasNominal(need)}`;
    $("initDesc").textContent = `≈ ${ringkasNominal(init)}`;
    calc();
  });
});

// Event listeners input reguler
["age", "tage", "rate", "inf"].forEach(id => {
  $(id).addEventListener("input", calc);
});

// Theme switcher
const themeToggle = $("themeToggle");
themeToggle.addEventListener("click", () => {
  const current = document.documentElement.getAttribute("data-theme");
  const next = current === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try { localStorage.setItem("theme", next); } catch(e){}
});
try {
  const savedTheme = localStorage.getItem("theme");
  if (savedTheme) document.documentElement.setAttribute("data-theme", savedTheme);
} catch(e){}

// Share Link
$("shareBtn").addEventListener("click", () => {
  navigator.clipboard.writeText(window.location.href).then(() => {
    const btn = $("shareBtn");
    const original = btn.textContent;
    btn.textContent = "✅ Link Tersalin!";
    setTimeout(() => { btn.textContent = original; }, 2000);
  });
});

loadFromHash();
calc();
</script>
</body>
</html>
