<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Kalkulator Dana Pensiun instan berbasis Aturan 4% (Trinity Study), inflasi, dan bunga majemuk. Tanpa login dan tanpa simpan data.">
<title>Kalkulator Dana Pensiun</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fbf8f1;
  --card-input:#fcfaf5;
  --card-border:#ede5d6;
  --input-bg:#f5eedf;
  --input-border:#e5dcce;
  --tx:#141816;
  --tx-muted:#78716c;
  --tx-label:#79716b;
  --gold-tag:#a17838;
  --gold-bar:#c89542;
  --emerald-hero:#01472f;
  --emerald-hero-light:#8ae3a4;
  --emerald-val:#035b3c;
  --pill-save-bg:#e4f6eb;
  --pill-save-tx:#025437;
  --table-th-bg:#ede5d8;
  --table-border:#eadecc;
  --err-color:#dc2626;
  --radius-lg:22px;
  --radius-md:14px;
  --radius-sm:10px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1311;
    --card-input:#151c18;
    --card-border:#25302a;
    --input-bg:#1d2722;
    --input-border:#2d3a33;
    --tx:#f3f4f3;
    --tx-muted:#949f99;
    --tx-label:#87958e;
    --gold-tag:#d4aa63;
    --gold-bar:#d69e43;
    --emerald-hero:#033d28;
    --emerald-hero-light:#7ee7a0;
    --emerald-val:#2dd487;
    --pill-save-bg:#0d3522;
    --pill-save-tx:#6ee7b7;
    --table-th-bg:#1a231e;
    --table-border:#26342c;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1311;
  --card-input:#151c18;
  --card-border:#25302a;
  --input-bg:#1d2722;
  --input-border:#2d3a33;
  --tx:#f3f4f3;
  --tx-muted:#949f99;
  --tx-label:#87958e;
  --gold-tag:#d4aa63;
  --gold-bar:#d69e43;
  --emerald-hero:#033d28;
  --emerald-hero-light:#7ee7a0;
  --emerald-val:#2dd487;
  --pill-save-bg:#0d3522;
  --pill-save-tx:#6ee7b7;
  --table-th-bg:#1a231e;
  --table-border:#26342c;
}

*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg);color:var(--tx);
  font-family:'Manrope',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:15px;line-height:1.5;
  padding:36px 24px 60px;
  transition:background .2s,color .2s;
}
.app-container{
  max-width:1160px;margin:0 auto;
}
.app-layout{
  display:grid;
  grid-template-columns:410px minmax(0,1fr);
  gap:32px;
  align-items:start;
}
.app-layout > *{min-width:0}
@media (max-width:960px){
  .app-layout{grid-template-columns:minmax(0,1fr);gap:24px}
  body{padding:20px 14px 48px}
}

/* Kolom Kiri: Header & Form */
.col-left{display:flex;flex-direction:column;gap:18px}
.header-top{display:flex;justify-content:space-between;align-items:center}
.badge-tag{
  font-family:'Sora',sans-serif;
  font-size:.73rem;font-weight:700;
  letter-spacing:.09em;color:var(--gold-tag);
  text-transform:uppercase;
}
.btn-theme{
  background:transparent;border:1px solid var(--input-border);
  color:var(--tx-muted);font-family:'Manrope',sans-serif;
  font-size:.8rem;font-weight:600;padding:5px 14px;
  border-radius:999px;cursor:pointer;
}
.btn-theme:hover{border-color:var(--tx-muted)}
h1.title{
  font-family:'Sora',sans-serif;
  font-size:2.1rem;font-weight:800;line-height:1.15;
  letter-spacing:-0.03em;color:var(--tx);margin-top:4px;
}
.presets{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.btn-preset{
  background:var(--card-input);border:1px solid var(--card-border);
  color:var(--tx);font-family:'Manrope',sans-serif;
  font-size:.82rem;font-weight:600;padding:7px 14px;
  border-radius:999px;cursor:pointer;
  transition:all .15s ease;
}
.btn-preset:hover{border-color:var(--gold-tag);color:var(--gold-tag)}

.form-card{
  background:var(--card-input);
  border:1px solid var(--card-border);
  border-radius:var(--radius-lg);
  padding:24px 22px;
  display:flex;flex-direction:column;gap:18px;
}
.row-2col{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{display:flex;flex-direction:column}
.field label{
  font-family:'Sora',sans-serif;
  font-size:.7rem;font-weight:700;
  letter-spacing:.05em;color:var(--tx-label);
  text-transform:uppercase;margin-bottom:8px;
}
.input-box{
  position:relative;display:flex;align-items:center;
  background:var(--input-bg);border:1px solid var(--input-border);
  border-radius:var(--radius-md);overflow:hidden;
  transition:border-color .15s,box-shadow .15s;
}
.input-box:focus-within{
  border-color:var(--emerald-hero);
  box-shadow:0 0 0 2px rgba(1,71,47,.15);
}
.input-prefix,.input-suffix{
  font-size:.9rem;font-weight:600;color:var(--tx-muted);
  pointer-events:none;padding:0 12px;
}
input.input-elem{
  width:100%;border:0;background:transparent;
  padding:12px 14px;font-family:'Manrope',sans-serif;
  font-size:1.02rem;font-weight:700;color:var(--tx);
  outline:none;
}
.input-box.with-prefix input.input-elem{padding-left:0}
.input-box.with-suffix input.input-elem{padding-right:0;text-align:left}
.input-box.with-suffix .input-suffix{text-align:right}
.terbilang{
  font-size:.76rem;color:var(--gold-tag);
  margin-top:5px;font-weight:600;min-height:16px;
}

.btn-share{
  width:100%;display:flex;justify-content:center;align-items:center;gap:8px;
  background:transparent;border:1px solid var(--card-border);
  color:var(--gold-tag);font-family:'Manrope',sans-serif;
  font-size:.88rem;font-weight:700;padding:12px 16px;
  border-radius:var(--radius-md);cursor:pointer;
  transition:all .15s;margin-top:2px;
}
.btn-share:hover{background:var(--input-bg);border-color:var(--gold-tag)}

/* Kolom Kanan: Hasil */
.col-right{display:flex;flex-direction:column;gap:20px}
.hero-card{
  background:var(--emerald-hero);
  color:#ffffff;border-radius:var(--radius-lg);
  padding:32px 28px;position:relative;overflow:hidden;
}
.hero-label{
  font-family:'Sora',sans-serif;
  font-size:.72rem;font-weight:700;
  letter-spacing:.09em;color:rgba(255,255,255,.75);
  text-transform:uppercase;margin-bottom:8px;
}
.hero-amount{
  font-family:'Sora',sans-serif;
  font-size:2.8rem;font-weight:800;line-height:1.1;
  letter-spacing:-0.03em;color:#ffffff;margin-bottom:10px;
}
@media (max-width:560px){
  .hero-amount{font-size:2.1rem}
}
.hero-sub{
  font-size:.9rem;color:rgba(255,255,255,.8);font-weight:500;
  margin-bottom:28px;
}
.hero-footer{
  display:grid;grid-template-columns:1fr 1fr;gap:20px;
  padding-top:20px;border-top:1px solid rgba(255,255,255,.15);
}
.hero-foot-col small{
  display:block;font-size:.78rem;color:rgba(255,255,255,.7);
  margin-bottom:4px;font-weight:500;
}
.hero-foot-col strong{
  font-family:'Sora',sans-serif;
  font-size:1.15rem;font-weight:700;color:#ffffff;
}
.hero-foot-col strong.accent{
  color:var(--emerald-hero-light);
}

.result-card{
  background:var(--card-input);
  border:1px solid var(--card-border);
  border-radius:var(--radius-lg);
  padding:26px 24px;
}
.result-card h2{
  font-family:'Sora',sans-serif;
  font-size:1.1rem;font-weight:700;letter-spacing:-0.01em;
  color:var(--tx);margin-bottom:14px;
}

/* Progress bar komposisi */
.comp-bar{
  display:flex;height:12px;border-radius:999px;
  overflow:hidden;background:var(--input-bg);
  margin-bottom:10px;
}
.bar-part-setor{background:var(--emerald-hero);transition:width .3s}
.bar-part-bunga{background:var(--gold-bar);transition:width .3s}
.comp-legend{
  display:flex;gap:20px;font-size:.8rem;color:var(--tx-muted);
  font-weight:600;margin-bottom:18px;
}
.legend-item{display:flex;align-items:center;gap:7px}
.dot{width:9px;height:9px;border-radius:50%}

/* List rincian */
.rincian-list{display:flex;flex-direction:column}
.rincian-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:11px 0;border-bottom:1px solid var(--card-border);
  font-size:.9rem;gap:12px;
}
.rincian-row:last-child{border-bottom:0}
.rincian-row span.label{color:var(--tx-muted)}
.rincian-row strong.val{
  font-family:'Manrope',sans-serif;
  font-weight:700;color:var(--tx);text-align:right;
}
.rincian-row strong.val.emerald{color:var(--emerald-val)}
.rincian-row strong.val.red{color:var(--err-color)}
.pill-save{
  display:inline-block;padding:4px 10px;border-radius:6px;
  background:var(--pill-save-bg);color:var(--pill-save-tx);
  font-weight:700;font-size:.88rem;
}

/* Tabel proyeksi */
.proj-header{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:14px;flex-wrap:wrap;gap:8px;
}
.proj-header span.tag{
  font-size:.82rem;color:var(--tx-muted);font-weight:500;
}
.table-scroll{
  max-height:280px;overflow-y:auto;overflow-x:auto;
  border-radius:var(--radius-md);border:1px solid var(--table-border);
}
table.proj-table{
  width:100%;border-collapse:collapse;font-size:.85rem;white-space:nowrap;
}
table.proj-table th{
  position:sticky;top:0;background:var(--table-th-bg);
  font-family:'Sora',sans-serif;font-size:.7rem;font-weight:700;
  letter-spacing:.06em;color:var(--tx-label);text-transform:uppercase;
  padding:10px 14px;text-align:right;border-bottom:1px solid var(--table-border);
  z-index:2;
}
table.proj-table th:first-child{text-align:left}
table.proj-table td{
  padding:9px 14px;text-align:right;border-bottom:1px solid var(--table-border);
  color:var(--tx);font-weight:600;
}
table.proj-table td:first-child{text-align:left;color:var(--tx-muted)}
table.proj-table td.saldo{color:var(--emerald-val);font-weight:700}
table.proj-table tr:last-child td{border-bottom:0}
@media (max-width:560px){
  table.proj-table{font-size:.78rem}
  table.proj-table th,table.proj-table td{padding:8px 9px}
}

.disclaimer{
  font-size:.8rem;color:var(--tx-muted);line-height:1.5;margin-top:2px;
}
.alert-box{
  background:#fee2e2;border:1px solid #fca5a5;color:#991b1b;
  padding:16px;border-radius:var(--radius-md);font-weight:600;font-size:.92rem;
}
</style>
</head>
<body>
<div class="app-container">
  <div class="app-layout">
    
    <!-- SISI KIRI: INPUT -->
    <div class="col-left">
      <div class="header-top">
        <span class="badge-tag">Passive Income</span>
        <button id="themeToggle" class="btn-theme" type="button">☾ Gelap</button>
      </div>

      <h1 class="title">Kalkulator<br>Dana Pensiun</h1>

      <div class="presets">
        <button type="button" class="btn-preset" data-p="20,55,2000000,2000000,4,5">Realita (20 th)</button>
      </div>

      <div class="form-card">
        <div class="row-2col">
          <div class="field">
            <label for="age">Umur Sekarang</label>
            <div style="display:grid;grid-template-columns:1.2fr 1fr;gap:6px">
              <div class="input-box with-suffix">
                <input id="age" class="input-elem" type="number" value="30" min="1" max="100">
                <span class="input-suffix">th</span>
              </div>
              <div class="input-box with-suffix">
                <input id="ageM" class="input-elem" type="number" value="0" min="0" max="11" placeholder="0">
                <span class="input-suffix">bln</span>
              </div>
            </div>
          </div>
          <div class="field">
            <label for="tage">Umur Pensiun</label>
            <div class="input-box with-suffix">
              <input id="tage" class="input-elem" type="number" value="55" min="2" max="100">
              <span class="input-suffix">th</span>
            </div>
          </div>
        </div>

        <div class="field">
          <label for="need">Pengeluaran Bulanan (Nilai Sekarang)</label>
          <div class="input-box with-prefix">
            <span class="input-prefix">Rp</span>
            <input id="need" class="input-elem" type="text" inputmode="numeric" value="10.000.000">
          </div>
          <div id="needDesc" class="terbilang">≈ 10 Juta</div>
        </div>

        <div class="field">
          <label for="init">Dana Awal yang Sudah Siap</label>
          <div class="input-box with-prefix">
            <span class="input-prefix">Rp</span>
            <input id="init" class="input-elem" type="text" inputmode="numeric" value="50.000.000">
          </div>
          <div id="initDesc" class="terbilang">≈ 50 Juta</div>
        </div>

        <div class="row-2col">
          <div class="field">
            <label for="rate">Return / Tahun</label>
            <div class="input-box with-suffix">
              <input id="rate" class="input-elem" type="number" value="7" step="0.1" min="0" max="50">
              <span class="input-suffix">%</span>
            </div>
          </div>
          <div class="field">
            <label for="inf">Inflasi / Tahun</label>
            <div class="input-box with-suffix">
              <input id="inf" class="input-elem" type="number" value="4" step="0.1" min="0" max="30">
              <span class="input-suffix">%</span>
            </div>
          </div>
        </div>
      </div>

      <button id="shareBtn" class="btn-share" type="button">
        🔗 Salin link simulasi ini
      </button>
    </div>

    <!-- SISI KANAN: HASIL -->
    <div id="out" class="col-right"></div>

  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const fmt = n => Math.round(n).toLocaleString("id-ID");
const rp = n => "Rp " + fmt(n);

function ringkasNominal(num) {
  if (num >= 1e12) return (num / 1e12).toFixed(1).replace(/\.0$/, '') + " Triliun";
  if (num >= 1e9) return (num / 1e9).toFixed(1).replace(/\.0$/, '') + " Miliar";
  if (num >= 1e6) return (num / 1e6).toFixed(1).replace(/\.0$/, '') + " Juta";
  if (num >= 1e3) return (num / 1e3).toFixed(1).replace(/\.0$/, '') + " Ribu";
  return num > 0 ? fmt(num) : "";
}

function parseCurrency(str) {
  const digits = String(str).replace(/[^\d]/g, "");
  return digits ? parseInt(digits, 10) : 0;
}

function bindCurrencyInput(input, descEl) {
  const update = () => {
    const val = parseCurrency(input.value);
    input.value = val ? fmt(val) : "";
    if (descEl) descEl.textContent = val ? `≈ ${ringkasNominal(val)}` : "";
    calc();
  };
  input.addEventListener("input", update);
  if (descEl) {
    const val = parseCurrency(input.value);
    descEl.textContent = val ? `≈ ${ringkasNominal(val)}` : "";
  }
}

bindCurrencyInput($("need"), $("needDesc"));
bindCurrencyInput($("init"), $("initDesc"));

function calc() {
  const age = parseInt($("age").value, 10) || 0;
  const ageM = Math.min(11, Math.max(0, parseInt($("ageM").value, 10) || 0));
  const tage = parseInt($("tage").value, 10) || 0;
  const need = parseCurrency($("need").value);
  const init = parseCurrency($("init").value);
  const r = (parseFloat($("rate").value) || 0) / 100;
  const f = (parseFloat($("inf").value) || 0) / 100;
  const out = $("out");

  if (age < 0 || tage <= 0) {
    out.innerHTML = '<div class="alert-box">Umur harus berupa angka positif.</div>';
    return;
  }
  const m = (tage - age) * 12 - ageM;
  if (m <= 0) {
    out.innerHTML = '<div class="alert-box">Umur target pensiun harus lebih besar dari umur saat ini.</div>';
    return;
  }
  if (need <= 0) {
    out.innerHTML = '<div class="alert-box">Masukkan estimasi pengeluaran bulanan.</div>';
    return;
  }

  const yrsDecimal = m / 12;
  const i = r / 12;

  // Formula finansial
  const futNeed = need * Math.pow(1 + f, yrsDecimal);
  const target = futNeed * 12 * 25;
  const initFV = i === 0 ? init : init * Math.pow(1 + i, m);
  const gap = Math.max(0, target - initFV);
  const pmt = gap === 0 ? 0 : (i === 0 ? gap / m : (gap * i) / (Math.pow(1 + i, m) - 1));
  const plainGap = Math.max(0, target - init);
  const plainPmt = plainGap / m;

  const totalSetoran = init + (pmt * m);
  const totalBunga = Math.max(0, target - totalSetoran);
  const persenSetor = Math.min(100, Math.round((totalSetoran / target) * 100)) || 0;
  const persenBunga = Math.max(0, 100 - persenSetor);

  // Tabel proyeksi per tahun (memperhitungkan sisa bulan berjalan)
  let rows = "";
  let bal = init;
  let totalSetorRun = init;
  const firstMonths = Math.min(ageM > 0 ? (12 - ageM) : 12, m);

  // Periode tahun pertama
  for (let k = 0; k < firstMonths; k++) {
    bal = (bal * (1 + i)) + pmt;
    totalSetorRun += pmt;
  }
  const labelTahunPertama = ageM > 0 
    ? `${age + 1} th <span style="font-size:.74rem;color:var(--tx-muted);font-weight:400">(${firstMonths} bln)</span>`
    : `${age + 1} th`;

  rows += `<tr>
    <td>${labelTahunPertama}</td>
    <td>${rp(totalSetorRun)}</td>
    <td class="saldo">${rp(bal)}</td>
  </tr>`;

  // Tahun-tahun berikutnya hingga umur target pensiun
  for (let y = age + 2; y <= tage; y++) {
    for (let k = 0; k < 12; k++) {
      bal = (bal * (1 + i)) + pmt;
      totalSetorRun += pmt;
    }
    rows += `<tr>
      <td>${y} th</td>
      <td>${rp(totalSetorRun)}</td>
      <td class="saldo">${rp(bal)}</td>
    </tr>`;
  }
  // Update URL hash
  const params = new URLSearchParams({
    age, ageM, tage, need, init, rate: $("rate").value, inf: $("inf").value
  });
  window.history.replaceState(null, "", `#${params.toString()}`);

  const isSudahCukup = gap === 0;
  const durasiTh = Math.floor(m / 12), durasiBl = m % 12;
  const durasiTeks = durasiTh
    ? `${durasiTh} tahun${durasiBl ? ` ${durasiBl} bulan` : ""} (${m} bulan)`
    : `${m} bulan`;

  out.innerHTML = `
    <!-- HERO CARD -->
    <div class="hero-card">
      <div class="hero-label">Investasi Per Bulan</div>
      <div class="hero-amount">${isSudahCukup ? "Rp 0" : rp(pmt)}</div>
      <div class="hero-sub">
        ${isSudahCukup 
          ? `Dana awal Anda berkembang mandiri melampaui target tanpa perlu setoran tambahan.`
          : `Disisihkan setiap akhir bulan selama ${durasiTeks}.`}
      </div>
      <div class="hero-footer">
        <div class="hero-foot-col">
          <small>Target dana pensiun</small>
          <strong class="accent">${ringkasNominal(target)}</strong>
        </div>
        <div class="hero-foot-col">
          <small>Pengeluaran saat pensiun</small>
          <strong>${rp(futNeed)} <span style="font-size:.85rem;font-weight:500">/bln</span></strong>
        </div>
      </div>
    </div>

    <!-- KOMPOSISI DANA TARGET -->
    <div class="result-card">
      <h2>Komposisi dana target</h2>
      <div class="comp-bar">
        <div class="bar-part-setor" style="width:${persenSetor}%" title="Setoran pokok: ${persenSetor}%"></div>
        <div class="bar-part-bunga" style="width:${persenBunga}%" title="Efek bunga majemuk: ${persenBunga}%"></div>
      </div>
      <div class="comp-legend">
        <div class="legend-item"><span class="dot" style="background:var(--emerald-hero)"></span>Setoran pokok (${persenSetor}%)</div>
        <div class="legend-item"><span class="dot" style="background:var(--gold-bar)"></span>Efek bunga majemuk (${persenBunga}%)</div>
      </div>

      <div class="rincian-list">
        <div class="rincian-row">
          <span class="label">Pengeluaran bulanan saat pensiun (+ inflasi ${(f*100).toFixed(1)}%)</span>
          <strong class="val">${rp(futNeed)}</strong>
        </div>
        <div class="rincian-row">
          <span class="label">Target total dana pensiun (Rule of 25)</span>
          <strong class="val emerald">${rp(target)}</strong>
        </div>
        <div class="rincian-row">
          <span class="label">Pertumbuhan dana awal di masa depan</span>
          <strong class="val">${rp(initFV)}</strong>
        </div>
        <div class="rincian-row">
          <span class="label">Kekurangan yang perlu dikumpulkan</span>
          <strong class="val">${rp(gap)}</strong>
        </div>
        <div class="rincian-row">
          <span class="label">Total uang riil yang kamu setor</span>
          <strong class="val">${rp(totalSetoran)}</strong>
        </div>
        ${!isSudahCukup ? `
        <div class="rincian-row">
          <span class="label">Jika menabung biasa (tanpa investasi)</span>
          <strong class="val red">${rp(plainPmt)} /bln</strong>
        </div>
        <div class="rincian-row">
          <span class="label">Hemat berkat bunga majemuk</span>
          <strong class="val"><span class="pill-save">Hemat ${rp(Math.max(0, plainPmt - pmt))} /bln</span></strong>
        </div>` : ''}
      </div>
    </div>

    <!-- PROYEKSI SALDO PER TAHUN -->
    <div class="result-card">
      <div class="proj-header">
        <h2 style="margin:0">Proyeksi saldo per tahun</h2>
        <span class="tag">Target tercapai di umur ${tage}</span>
      </div>
      <div class="table-scroll">
        <table class="proj-table">
          <thead>
            <tr>
              <th>Umur</th>
              <th>Total Setoran</th>
              <th>Saldo</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>

    <p class="disclaimer">Catatan: Bukan saran penasihat keuangan berlisensi.</p>
  `;
}

// Preset handler
document.querySelectorAll(".btn-preset").forEach(btn => {
  btn.addEventListener("click", () => {
    const [age, tage, need, init, rate, inf] = btn.dataset.p.split(",");
    $("age").value = age;
    $("ageM").value = 0;
    $("tage").value = tage;
    $("need").value = fmt(need);
    $("init").value = fmt(init);
    $("rate").value = rate;
    $("inf").value = inf;
    $("needDesc").textContent = `≈ ${ringkasNominal(need)}`;
    $("initDesc").textContent = `≈ ${ringkasNominal(init)}`;
    calc();
  });
});

["age", "ageM", "tage", "rate", "inf"].forEach(id => {
  $(id).addEventListener("input", calc);
});

// Theme switcher
const themeToggle = $("themeToggle");
function applyTheme(th) {
  document.documentElement.setAttribute("data-theme", th);
  themeToggle.textContent = th === "dark" ? "☼ Terang" : "☾ Gelap";
}

themeToggle.addEventListener("click", () => {
  const current = document.documentElement.getAttribute("data-theme");
  const next = current === "dark" ? "light" : "dark";
  applyTheme(next);
  try { localStorage.setItem("theme", next); } catch(e){}
});

try {
  const saved = localStorage.getItem("theme");
  if (saved) applyTheme(saved);
} catch(e){}

// Share
$("shareBtn").addEventListener("click", () => {
  navigator.clipboard.writeText(window.location.href).then(() => {
    const btn = $("shareBtn");
    const orig = btn.textContent;
    btn.textContent = "✅ Link tersalin ke clipboard!";
    setTimeout(() => { btn.textContent = orig; }, 2000);
  });
});

// Load hash URL jika ada
if (window.location.hash.length > 1) {
  try {
    const p = new URLSearchParams(window.location.hash.slice(1));
    if (p.has("age")) $("age").value = p.get("age");
    if (p.has("ageM")) $("ageM").value = p.get("ageM");
    if (p.has("tage")) $("tage").value = p.get("tage");
    if (p.has("need")) $("need").value = fmt(parseInt(p.get("need"), 10) || 10000000);
    if (p.has("init")) $("init").value = fmt(parseInt(p.get("init"), 10) || 50000000);
    if (p.has("rate")) $("rate").value = p.get("rate");
    if (p.has("inf")) $("inf").value = p.get("inf");
    $("needDesc").textContent = `≈ ${ringkasNominal(parseCurrency($("need").value))}`;
    $("initDesc").textContent = `≈ ${ringkasNominal(parseCurrency($("init").value))}`;
  } catch(e){}
}

calc();
</script>
</body>
</html>
